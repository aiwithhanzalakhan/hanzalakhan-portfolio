<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Todo List</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    li { margin: 5px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    li.completed span { text-decoration: line-through; color: gray; }
    button { margin-left: 5px; }
  </style>
</head>
<body>
  <h2>Simple Todo List</h2>
  <input type="text" id="todo-input" placeholder="Add new task">
  <button id="add-btn">Add Task</button>
  <ul id="todo-list"></ul>

  <script>
    const input = document.getElementById("todo-input");
    const addBtn = document.getElementById("add-btn");
    const todoList = document.getElementById("todo-list");
    addBtn.addEventListener("click",()=>{
       const task =input.value.trim()
       if (!task) return;
        const li =document.createElement("li")    
        li.innerHTML=`
        <span>${task}</span>
        <div>
          <button class="edit-btn">✏️</button>
          <button class="delete-btn">❌</button>
        </div>
        `    
        todoList.appendChild(li)
          input.value=""
       
    })
    todoList.addEventListener("click",(e)=>{
        const li = e.target.closest("li");
      if (!li) return;

      
      if (e.target.classList.contains("delete-btn")) {
        li.remove();
      }

    })
   
  </script>
</body>
</html>
